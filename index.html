<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Quiz</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    background: linear-gradient(135deg, #1f2937, #111827);
  }
  #overlay {
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 24px;
    color: #fff;
  }
  #card {
    background: #1f2937;
    border-radius: 16px;
    padding: 28px 22px;
    max-width: 480px;
    width: 100%;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    text-align: center;
  }
  #progress {
    font-size: 14px;
    color: #9ca3af;
    margin-bottom: 10px;
  }
  #question {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 24px;
    line-height: 1.5;
    text-align: left;
  }
  .option-btn {
    display: block;
    width: 100%;
    text-align: left;
    padding: 14px 16px;
    margin-bottom: 12px;
    border-radius: 10px;
    border: 2px solid #374151;
    background: #111827;
    color: #fff;
    font-size: 16px;
    cursor: pointer;
    transition: 0.2s;
  }
  .option-btn:hover { border-color: #60a5fa; }
  .option-btn.selected { background: #2563eb; border-color: #2563eb; }
  .option-btn.correct { background: #16a34a; border-color: #16a34a; }
  .option-btn.wrong { background: #dc2626; border-color: #dc2626; }
  .option-btn:disabled { cursor: default; }

  #next-btn, #restart-btn, #review-btn {
    margin-top: 8px;
    padding: 14px 28px;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    display: none;
  }
  #next-btn:disabled { background: #374151; cursor: not-allowed; }

  #loading { font-size: 16px; color: #9ca3af; }

  #score-box { display: none; }
  #score-text { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
  #score-sub { font-size: 15px; color: #9ca3af; margin-bottom: 20px; }

  #review-box { display: none; text-align: left; margin-top: 16px; }
  .review-item {
    background: #111827;
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 12px;
    border-left: 4px solid #dc2626;
  }
  .review-q { font-weight: 600; margin-bottom: 8px; }
  .review-your { color: #f87171; font-size: 14px; margin-bottom: 4px; }
  .review-correct { color: #4ade80; font-size: 14px; }
</style>
</head>
<body>

<div id="overlay">
  <div id="card">
    <div id="loading">Questions load ho rahe hain...</div>

    <div id="progress" style="display:none;"></div>
    <div id="question" style="display:none;"></div>
    <div id="options"></div>
    <button id="next-btn">Next</button>

    <div id="score-box">
      <div id="score-text"></div>
      <div id="score-sub"></div>
      <button id="review-btn">Galat Wale Dekho ❌</button>
      <button id="restart-btn">Dobara Quiz Do 🔁</button>
      <div id="review-box"></div>
    </div>
  </div>
</div>

<script>
// ==================== CONFIG ====================
// Apna Firebase Realtime Database ka link yahan daalo (bina .json ke)
const FIREBASE_URL = "https://newfire-2258c-default-rtdb.firebaseio.com";
// ==================================================

let questions = [];      // Firebase se aaya batch
let currentIndex = 0;
let selectedAnswers = {}; // { questionIndex: selectedLetter }

async function loadQuestions() {
  showLoadingState();
  selectedAnswers = {};
  currentIndex = 0;

  try {
    const res = await fetch(`${FIREBASE_URL}/questions.json`);
    const data = await res.json();

    if (!data) {
      document.getElementById("loading").textContent = "Abhi koi question available nahi hai.";
      return;
    }

    questions = Object.keys(data).map(k => ({ key: k, ...data[k] }));

    if (questions.length === 0) {
      document.getElementById("loading").textContent = "Abhi koi question available nahi hai.";
      return;
    }

    showQuestion();
  } catch (err) {
    console.error(err);
    document.getElementById("loading").textContent = "Firebase se data lene me error aaya.";
  }
}

function showLoadingState() {
  document.getElementById("loading").style.display = "block";
  document.getElementById("loading").textContent = "Questions load ho rahe hain...";
  document.getElementById("progress").style.display = "none";
  document.getElementById("question").style.display = "none";
  document.getElementById("options").innerHTML = "";
  document.getElementById("next-btn").style.display = "none";
  document.getElementById("score-box").style.display = "none";
  document.getElementById("review-box").style.display = "none";
  document.getElementById("review-box").innerHTML = "";
}

function showQuestion() {
  document.getElementById("loading").style.display = "none";
  document.getElementById("score-box").style.display = "none";

  const q = questions[currentIndex];

  const progressEl = document.getElementById("progress");
  progressEl.style.display = "block";
  progressEl.textContent = `Question ${currentIndex + 1} / ${questions.length}`;

  const questionEl = document.getElementById("question");
  questionEl.style.display = "block";
  questionEl.textContent = q.question;

  const optionsEl = document.getElementById("options");
  optionsEl.innerHTML = "";

  q.options.forEach((opt) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.textContent = opt;
    const letter = opt.trim().charAt(0);
    if (selectedAnswers[currentIndex] === letter) {
      btn.classList.add("selected");
    }
    btn.onclick = () => selectOption(letter, btn);
    optionsEl.appendChild(btn);
  });

  const nextBtn = document.getElementById("next-btn");
  nextBtn.style.display = "block";
  nextBtn.textContent = (currentIndex === questions.length - 1) ? "Submit Quiz" : "Next";
  nextBtn.disabled = !(currentIndex in selectedAnswers);
}

function selectOption(letter, btnEl) {
  selectedAnswers[currentIndex] = letter;
  document.querySelectorAll(".option-btn").forEach(b => b.classList.remove("selected"));
  btnEl.classList.add("selected");
  document.getElementById("next-btn").disabled = false;
}

document.getElementById("next-btn").onclick = () => {
  if (!(currentIndex in selectedAnswers)) return;

  if (currentIndex === questions.length - 1) {
    finishQuiz();
  } else {
    currentIndex++;
    showQuestion();
  }
};

function finishQuiz() {
  document.getElementById("progress").style.display = "none";
  document.getElementById("question").style.display = "none";
  document.getElementById("options").innerHTML = "";
  document.getElementById("next-btn").style.display = "none";

  let correctCount = 0;
  const wrongList = [];
  const wrongCountByPhoto = {};

  questions.forEach((q, idx) => {
    const userLetter = selectedAnswers[idx];
    const correctLetter = String(q.answer).trim().charAt(0);
    if (userLetter === correctLetter) {
      correctCount++;
    } else {
      wrongList.push({ q, userLetter, correctLetter });
      if (q.photo_id) {
        wrongCountByPhoto[q.photo_id] = (wrongCountByPhoto[q.photo_id] || 0) + 1;
      }
    }
  });

  document.getElementById("score-text").textContent = `Aapka Score: ${correctCount} / ${questions.length}`;
  document.getElementById("score-sub").textContent =
    wrongList.length === 0 ? "Sabhi sahi! 🎉" : `${wrongList.length} sawal galat hue.`;

  const reviewBtn = document.getElementById("review-btn");
  reviewBtn.style.display = wrongList.length > 0 ? "block" : "none";

  const reviewBox = document.getElementById("review-box");
  reviewBox.innerHTML = "";
  reviewBox.style.display = "none";

  wrongList.forEach(({ q, userLetter, correctLetter }) => {
    const item = document.createElement("div");
    item.className = "review-item";
    item.innerHTML = `
      <div class="review-q">${escapeHtml(q.question)}</div>
      <div class="review-your">Aapka jawab: ${userLetter || "(chuna nahi)"}</div>
      <div class="review-correct">Sahi jawab: ${correctLetter}</div>
    `;
    reviewBox.appendChild(item);
  });

  document.getElementById("score-box").style.display = "block";

  reportWrongCounts(wrongCountByPhoto);
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

document.getElementById("review-btn").onclick = () => {
  const box = document.getElementById("review-box");
  const btn = document.getElementById("review-btn");
  if (box.style.display === "none") {
    box.style.display = "block";
    btn.textContent = "Galat Wale Chupao";
  } else {
    box.style.display = "none";
    btn.textContent = "Galat Wale Dekho ❌";
  }
};

document.getElementById("restart-btn").onclick = () => {
  loadQuestions();
};

// Har photo_id ka wrong_count Firebase me update karo, taaki bot ko pata chale
// kaunsi photo sabse zyada galtiyan de rahi hai.
async function reportWrongCounts(wrongCountByPhoto) {
  for (const photoId in wrongCountByPhoto) {
    try {
      const getRes = await fetch(`${FIREBASE_URL}/photos/${photoId}/wrong_count.json`);
      const current = (await getRes.json()) || 0;
      const updated = current + wrongCountByPhoto[photoId];
      await fetch(`${FIREBASE_URL}/photos/${photoId}/wrong_count.json`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(updated)
      });
    } catch (err) {
      console.error("wrong_count update fail:", photoId, err);
    }
  }
}

// Page load hote hi questions laao
loadQuestions();
</script>

</body>
</html>
